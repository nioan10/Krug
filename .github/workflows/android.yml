name: Android build
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android --no-daemon assembleRelease assembleDebug
      - name: Collect unsigned APK and signing tool
        run: |
          mkdir -p android-artifact
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android-artifact/
          cp android/app/build/outputs/apk/debug/app-debug.apk android-artifact/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: okrug-android-unsigned
          path: android-artifact/
          retention-days: 7
  emulator:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: okrug-android-unsigned
          path: android-artifact
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/test-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okrug-android-emulator
          path: android-artifact/emulator.png
          if-no-files-found: ignore
