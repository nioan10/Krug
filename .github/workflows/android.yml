name: Android build
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android --no-daemon assembleRelease
      - name: Collect unsigned APK and signing tool
        run: |
          mkdir -p android-artifact
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android-artifact/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: okrug-android-unsigned
          path: android-artifact/
          retention-days: 7
