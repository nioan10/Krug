# Linux VPS only: host networking preserves WebRTC UDP and source addresses.
services:
  app:
    build: .
    image: krug-app
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      DATABASE_PATH: /app/data/krug.sqlite
      DESKTOP_UPDATE_DIR: /app/desktop-updates
    volumes:
      - krug_data:/app/data
      - stream_data:/app/streams
      - ./desktop-updates:/app/desktop-updates:ro
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  streams:
    profiles: [streams]
    image: krug-app
    command: ["node", "--import", "tsx", "server/stream-index.ts"]
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN}
      STREAM_ORIGIN: ${STREAM_ORIGIN:-}
      STREAM_DATABASE_PATH: /app/streams/streams.sqlite
      STREAM_LIVEKIT_URL: ${STREAM_LIVEKIT_URL:-}
      STREAM_LIVEKIT_API_KEY: ${STREAM_LIVEKIT_API_KEY:-}
      STREAM_LIVEKIT_API_SECRET: ${STREAM_LIVEKIT_API_SECRET:-}
    volumes:
      - stream_data:/app/streams
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 15s
    logging: *logs
  stream-livekit:
    profiles: [streams]
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml"]
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/stream-livekit.yaml:/etc/livekit.yaml:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    logging: *logs
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml"]
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logs
  caddy:
    image: livekit/caddyl4:v2.11.3
    command: ["run", "--config", "/etc/caddy.json"]
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/caddy.json:/etc/caddy.json:ro
      - caddy_data:/data
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      app: { condition: service_healthy }
      livekit: { condition: service_started }
    logging: *logs
volumes:
  krug_data:
  stream_data:
  caddy_data:
